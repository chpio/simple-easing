name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    container: ${{ vars.DOCKER_REGISTRY }}/git/rust:latest
    steps:
      - uses: actions/checkout@v7
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  # Releases the version in Cargo.toml if it isn't on crates.io yet, i.e. after the release PR got
  # merged: `cargo publish`, then the tag `vX.Y.Z` and the Gitea release (both through the API).
  # Does nothing on the other pushes.
  release:
    needs: [test]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    container: ${{ vars.DOCKER_REGISTRY }}/git/rust:latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: release-plz release --forge gitea
        env:
          # Past the kellnr proxy the image replaces crates.io with (in $CARGO_HOME/config.toml):
          # after `cargo publish`, release-plz waits until the version shows up in the index, and
          # kellnr caches the index files for about 30 minutes, as long as the default timeout.
          CARGO_HOME: /tmp/cargo-home
          GIT_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # Opens or updates the release PR with the version bump and the changelog entry, from the feat:
  # and fix: commits since the last release. After the release job, so it sees the new release.
  release-pr:
    needs: [release]
    runs-on: ubuntu-latest
    container: ${{ vars.DOCKER_REGISTRY }}/git/rust:latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      # Release-plz pushes the PR branch with git, from a copy of the repo in a temp dir, which
      # doesn't get the credentials checkout persists (they're only included for the checkout's
      # path). So git gets the token from the environment through a credential helper, it doesn't
      # end up in a file. Not the built-in token, the ci wouldn't run on the PR with it.
      - run: |
          # shellcheck disable=SC2016 # expanded by the shell git runs the helper in
          git config --global credential.helper '!f() { echo username=x-access-token; echo "password=$GIT_TOKEN"; }; f'
          release-plz release-pr --forge gitea
        env:
          # past the kellnr proxy like in the release job, its cached index wouldn't have the
          # version that job just released yet
          CARGO_HOME: /tmp/cargo-home
          GIT_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          # the release commit is made with git, which needs an identity
          GIT_AUTHOR_NAME: release-plz
          GIT_AUTHOR_EMAIL: release-plz@noreply.invalid
          GIT_COMMITTER_NAME: release-plz
          GIT_COMMITTER_EMAIL: release-plz@noreply.invalid
